<svg xmlns="http://www.w3.org/2000/svg" width="960" height="612" viewBox="0 0 960 612" role="img" aria-labelledby="title desc">
<title id="title">LibAnyar architecture</title>
<desc id="desc">A web frontend runs in the OS webview and talks to a C++17 core over three channels: native IPC, events, and zero-copy binary data. The core runs on LibAsyik.</desc>
